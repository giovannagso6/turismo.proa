<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

        *{
            box-sizing: border-box;
        }

        body{
            width: 100%;
            height: 100%;
        }

        form{
            width: 300px;
            margin: 200px auto;
            text-align: center;

        }

        input{
            display: block;
            margin: 10px auto;
            width: 250px;
            height: 30px;
        }
    </style>

</head>
<body>
    

    <form>
        
        <h3>Login</h3>
        <input type="text" placeholder="Login" required id="username">
        <input type="password" placeholder="Senha" required id="password">
        <button type="submit" onclick="logar(); return false">Entrar</button>

    </form> 

    <script>

        function logar(){

            var login = document.getElementById("username").value;
            var senha = document.getElementById("password").value;

            if(login === "admin" && senha === "123456"){
                alert("Login realizado com sucesso!");
                location.href = "index.html";
            }else{
                alert("Login ou senha incorretos!");
            }    
        }
    </script>
</body>
</html>
