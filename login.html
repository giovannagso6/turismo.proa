<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    
    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        h3{
        color: #33317C;
    font-size: 21px; }

        /* Menu */
        .header {
            background: #8f2f58;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            position: relative;
        }

        .logo {
            color: #fff;
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: none;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
        }

        .nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 24px;
        }

        .nav a {
            color: #fff;
            text-decoration: none;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .nav {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: #8f2f58;
            }

            .nav.aberto {
                display: block;
            }

            .nav ul {
                flex-direction: column;
                gap: 0;
            }

            .nav a {
                display: block;
                padding: 14px 20px;
                border-top: 1px solid rgba(255, 255, 255, 0.2);
            }
        }

        /* Formulário */
        form {
            width: 300px;
            margin: 100px auto;
            text-align: center;
        }

        input {
            display: block;
            margin: 10px auto;
            width: 250px;
            height: 30px;
        }
    </style>
</head>

<body>
    <header class="header">
        <a href="index.html" class="logo">VivaSP</a>

        <button class="menu-toggle" id="menu-toggle"
                aria-label="Abrir menu" aria-expanded="false" aria-controls="menu">
            ☰
        </button>

        <nav class="nav" id="menu">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="eventos.html">Eventos</a></li>
                <li><a href="rotas.html">Rotas</a></li>
                <li class="nav-item">
                        <a href="mapas.html">Mapas</a>
                    </li>
                <li><a href="contatos.html">Contatos</a></li>
                
            </ul>
        </nav>
    </header>

    <form id="form-login">
        <h3>Login</h3>
        <input type="text" placeholder="Login" required id="username">
        <input type="password" placeholder="Senha" required id="password">
        <button type="submit">Entrar</button>
    </form>

    <script>
        // Menu hamburger
        const botao = document.getElementById("menu-toggle");
        const menu = document.getElementById("menu");

        botao.addEventListener("click", () => {
            const aberto = menu.classList.toggle("aberto");
            botao.setAttribute("aria-expanded", aberto);
        });

        // Login
        document.getElementById("form-login").addEventListener("submit", (e) => {
            e.preventDefault();

            const login = document.getElementById("username").value;
            const senha = document.getElementById("password").value;

            if (login === "admin" && senha === "123456") {
                alert("Login realizado com sucesso!");
                location.href = "index.html";
            } else {
                alert("Login ou senha incorretos!");
            }
        });
    </script>
</body>
</html>
